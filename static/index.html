<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Media Downloader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            xblue: '#1d9bf0',
            ytred: '#ff0000',
            bilipink: '#fb7299',
            xdark: '#0f172a',
          }
        }
      }
    }
  </script>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #334155;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    .collapse-body { max-height: 0; overflow: hidden; transition: max-height .35s ease; }
    .collapse-body.open { max-height: 600px; }
    @keyframes fadein { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
    .toast-anim { animation: fadein .3s ease; }
    .tab-btn { position: relative; }
    .tab-btn.active::after {
      content: '';
      position: absolute; bottom: -1px; left: 0; right: 0;
      height: 2px; border-radius: 1px;
    }
    .tab-btn[data-tab="twitter"].active::after { background: #1d9bf0; }
    .tab-btn[data-tab="youtube"].active::after { background: #ff0000; }
    .tab-btn[data-tab="bilibili"].active::after { background: #fb7299; }
    @keyframes pulse-bar { 0%,100% { opacity: 1; } 50% { opacity: .7; } }
    .progress-pulse { animation: pulse-bar 1.5s ease-in-out infinite; }
  </style>
</head>

<body class="bg-slate-900 text-slate-200 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-10">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center gap-3">
      <svg class="w-7 h-7 text-xblue flex-shrink-0" fill="currentColor" viewBox="0 0 24 24">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
      </svg>
      <div>
        <h1 class="text-lg font-bold leading-tight tracking-tight">Media Downloader</h1>
        <p class="text-xs text-slate-500">X/Twitter &middot; YouTube &middot; Bilibili</p>
      </div>
    </div>
    <div class="max-w-3xl mx-auto px-4 flex gap-1">
      <button onclick="switchTab('twitter')" data-tab="twitter"
              class="tab-btn active px-4 py-2 text-sm font-medium text-slate-200 hover:text-white transition rounded-t-lg">
        X / Twitter
      </button>
      <button onclick="switchTab('youtube')" data-tab="youtube"
              class="tab-btn px-4 py-2 text-sm font-medium text-slate-400 hover:text-white transition rounded-t-lg">
        YouTube
      </button>
      <button onclick="switchTab('bilibili')" data-tab="bilibili"
              class="tab-btn px-4 py-2 text-sm font-medium text-slate-400 hover:text-white transition rounded-t-lg">
        Bilibili
      </button>
    </div>
  </header>

  <!-- Global save directory bar -->
  <div class="border-b border-slate-800 bg-slate-900/60">
    <div class="max-w-3xl mx-auto px-4 py-2.5 flex items-center gap-2 text-xs">
      <svg class="w-4 h-4 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7.5A2.25 2.25 0 015.25 5.25h3.879a1.5 1.5 0 011.06.44l2.122 2.12a1.5 1.5 0 001.06.44H18.75A2.25 2.25 0 0121 10.5v6.75a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 17.25v-9.75z"/></svg>
      <span class="text-slate-400 flex-shrink-0">保存到</span>
      <input id="globalSaveDir" type="text"
             placeholder="D:\SaveBox\下载"
             class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs font-mono text-slate-200 placeholder:text-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500/40 transition">
      <button onclick="toggleHistory()" id="historyBtn"
              class="flex-shrink-0 px-3 py-1.5 text-xs text-slate-300 hover:text-white border border-slate-700 hover:border-slate-600 rounded-lg transition flex items-center gap-1">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        历史
      </button>
    </div>
  </div>

  <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-6 space-y-5">

    <!-- ═══ Twitter ═══ -->
    <div id="tab-twitter">
      <div class="flex gap-2">
        <input id="twUrlInput" type="text"
               placeholder="粘贴 X / Twitter 推文链接（支持带中文标题）…"
               class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-sm
                      placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition"
               onkeydown="if(event.key==='Enter')twAnalyze()">
        <button onclick="twAnalyze()" id="twBtnAnalyze"
                class="bg-xblue hover:bg-blue-600 active:scale-95 text-white font-medium px-5 py-2.5 rounded-lg text-sm
                       transition whitespace-nowrap flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
          </svg>
          解析
        </button>
        <button onclick="startBatch('twitter')" id="twBtnBatch"
                class="bg-slate-700 hover:bg-slate-600 active:scale-95 text-slate-200 font-medium px-4 py-2.5 rounded-lg text-sm transition whitespace-nowrap flex items-center gap-1.5"
                title="批量下载：输入框里一行一个链接">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
          批量
        </button>
      </div>

      <div class="mt-3 rounded-lg border border-slate-700/60">
        <button onclick="toggleTwSettings()" class="w-full flex items-center justify-between px-4 py-2.5 text-sm text-slate-400 hover:text-slate-200 transition">
          <span class="flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 010 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 010-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            高级设置
          </span>
          <svg id="twChevron" class="w-4 h-4 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/>
          </svg>
        </button>
        <div id="twSettingsBody" class="collapse-body border-t border-slate-700/60">
          <div class="p-4 space-y-3">
            <div>
              <label class="block text-xs text-slate-400 mb-1">代理地址</label>
              <input id="twProxy" placeholder="socks5://127.0.0.1:1080"
                     class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm placeholder:text-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500/40 transition">
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Cookie</label>
              <textarea id="twCookie" rows="3" placeholder='Netscape 或 JSON 格式…'
                        class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm font-mono placeholder:text-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500/40 transition resize-y"></textarea>
            </div>
          </div>
        </div>
      </div>

      <div id="twLoading" class="hidden flex justify-center py-10"><div class="spinner"></div></div>

      <div id="twError" class="hidden mt-3 toast-anim rounded-lg border border-red-800/60 bg-red-950/50 px-4 py-3 text-sm text-red-300 flex items-start gap-2">
        <svg class="w-5 h-5 text-red-400 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z" clip-rule="evenodd"/>
        </svg>
        <span id="twErrorText"></span>
      </div>

      <div id="twResult" class="hidden mt-3 space-y-4">
        <div class="bg-slate-800/70 rounded-lg border border-slate-700/60 overflow-hidden">
          <div id="twThumbWrap" class="hidden"><img id="twThumbImg" class="w-full max-h-72 object-contain bg-black" alt=""></div>
          <div class="p-4 space-y-2">
            <div class="flex items-center gap-2 text-xs text-slate-400">
              <span id="twType" class="bg-blue-600/30 text-blue-300 px-2 py-0.5 rounded font-medium uppercase text-[11px]"></span>
              <span id="twAuthor" class="text-slate-300"></span>
              <span id="twDate" class="ml-auto"></span>
            </div>
            <p id="twDesc" class="text-sm text-slate-300 leading-relaxed"></p>
            <div id="twThreadBadge" class="hidden text-xs text-amber-400 flex items-center gap-1">
              <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path d="M4.75 2A2.75 2.75 0 002 4.75v3a2.75 2.75 0 002.75 2.75h3a2.75 2.75 0 002.75-2.75v-3A2.75 2.75 0 007.75 2h-3zM4.75 11.5A2.75 2.75 0 002 14.25v1A2.75 2.75 0 004.75 18h3a2.75 2.75 0 002.75-2.75v-1a2.75 2.75 0 00-2.75-2.75h-3zm7.75-3h3a2.75 2.75 0 002.75-2.75v-3A2.75 2.75 0 0015.5 0h-3A2.75 2.75 0 009.75 2.75v3a2.75 2.75 0 002.75 2.75zm0 3A2.75 2.75 0 009.75 14.25v1A2.75 2.75 0 0012.5 18h3a2.75 2.75 0 002.75-2.75v-1a2.75 2.75 0 00-2.75-2.75h-3z"/></svg>
              Thread 推文串
            </div>
          </div>
        </div>

        <div id="twFormatCard" class="hidden bg-slate-800/70 rounded-lg border border-slate-700/60 p-4 space-y-3">
          <h3 class="text-sm font-medium text-slate-300">选择分辨率</h3>
          <div id="twFormatList" class="grid grid-cols-2 sm:grid-cols-3 gap-2"></div>
          <button onclick="twDownload()" id="twBtnDl"
                  class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-[.98] text-white font-medium py-2.5 rounded-lg text-sm transition flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
            下载视频
          </button>
        </div>

        <div class="flex gap-2">
          <button onclick="twArticle()" id="twBtnArticle"
                  class="flex-1 bg-slate-700 hover:bg-slate-600 active:scale-[.98] text-slate-200 font-medium py-2.5 rounded-lg text-sm transition flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
            保存为 Markdown
          </button>
          <button onclick="twThread()" id="twBtnThread"
                  class="hidden flex-1 bg-amber-700/70 hover:bg-amber-600/70 active:scale-[.98] text-amber-100 font-medium py-2.5 rounded-lg text-sm transition flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7.5 7.5h.75v.75h-.75V7.5zm0 6h.75v.75h-.75v-.75zm6-6h.75v.75H13.5V7.5zm0 6h.75v.75h-.75v-.75zm6-6h.75v.75h-.75V7.5zm0 6h.75v.75h-.75v-.75zM3.75 3.75v16.5h16.5V3.75H3.75z"/></svg>
            下载完整 Thread
          </button>
        </div>
      </div>
    </div>

    <!-- ═══ YouTube ═══ -->
    <div id="tab-youtube" class="hidden">
      <div class="flex gap-2">
        <input id="ytUrlInput" type="text"
               placeholder="粘贴 YouTube 视频链接（支持带标题文字）…"
               class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-sm
                      placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-red-500/50 focus:border-red-500 transition"
               onkeydown="if(event.key==='Enter')ytAnalyze()">
        <button onclick="ytAnalyze()" id="ytBtnAnalyze"
                class="bg-ytred hover:bg-red-700 active:scale-95 text-white font-medium px-5 py-2.5 rounded-lg text-sm transition whitespace-nowrap flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
          解析
        </button>
        <button onclick="startBatch('youtube')" id="ytBtnBatch"
                class="bg-slate-700 hover:bg-slate-600 active:scale-95 text-slate-200 font-medium px-4 py-2.5 rounded-lg text-sm transition whitespace-nowrap flex items-center gap-1.5"
                title="批量下载：输入框里一行一个链接">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
          批量
        </button>
      </div>

      <div class="mt-3 rounded-lg border border-slate-700/60">
        <button onclick="toggleYtSettings()" class="w-full flex items-center justify-between px-4 py-2.5 text-sm text-slate-400 hover:text-slate-200 transition">
          <span class="flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 010 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 010-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            高级设置
          </span>
          <svg id="ytChevron" class="w-4 h-4 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>
        </button>
        <div id="ytSettingsBody" class="collapse-body border-t border-slate-700/60">
          <div class="p-4 space-y-3">
            <div>
              <label class="block text-xs text-slate-400 mb-1">代理地址</label>
              <input id="ytProxy" placeholder="socks5://127.0.0.1:1080"
                     class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm placeholder:text-slate-600 focus:outline-none focus:ring-2 focus:ring-red-500/40 transition">
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Cookie</label>
              <textarea id="ytCookie" rows="3" placeholder='用于访问年龄限制或会员视频…'
                        class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm font-mono placeholder:text-slate-600 focus:outline-none focus:ring-2 focus:ring-red-500/40 transition resize-y"></textarea>
            </div>
          </div>
        </div>
      </div>

      <div id="ytLoading" class="hidden flex justify-center py-10"><div class="spinner"></div></div>

      <div id="ytError" class="hidden mt-3 toast-anim rounded-lg border border-red-800/60 bg-red-950/50 px-4 py-3 text-sm text-red-300 flex items-start gap-2">
        <svg class="w-5 h-5 text-red-400 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z" clip-rule="evenodd"/>
        </svg>
        <span id="ytErrorText"></span>
      </div>

      <div id="ytResult" class="hidden mt-3 space-y-4">
        <div class="bg-slate-800/70 rounded-lg border border-slate-700/60 overflow-hidden">
          <div id="ytThumbWrap" class="hidden"><img id="ytThumbImg" class="w-full max-h-72 object-contain bg-black" alt=""></div>
          <div class="p-4 space-y-2">
            <div class="flex items-center gap-2 text-xs text-slate-400">
              <span class="bg-red-600/30 text-red-300 px-2 py-0.5 rounded font-medium uppercase text-[11px]">VIDEO</span>
              <span id="ytAuthor" class="text-slate-300"></span>
              <span id="ytDate" class="ml-auto"></span>
            </div>
            <p id="ytTitle" class="text-sm font-medium text-slate-200"></p>
            <p id="ytDesc" class="text-sm text-slate-400 leading-relaxed"></p>
            <div id="ytDuration" class="text-xs text-slate-500"></div>
          </div>
        </div>

        <div class="bg-slate-800/70 rounded-lg border border-slate-700/60 p-4 space-y-4">
          <div>
            <h3 class="text-sm font-medium text-slate-300 mb-2">选择分辨率</h3>
            <div id="ytFormatList" class="grid grid-cols-2 sm:grid-cols-3 gap-2"></div>
          </div>
          <div id="ytSubSection" class="hidden">
            <h3 class="text-sm font-medium text-slate-300 mb-2">字幕烧录（可选）</h3>
            <select id="ytSubSelect" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-300 focus:outline-none focus:ring-2 focus:ring-red-500/40 transition">
              <option value="">不烧录字幕</option>
            </select>

  <script>
    const $ = id => document.getElementById(id);
    function show(id) { $(id).classList.remove('hidden'); }
    function hide(id) { $(id).classList.add('hidden'); }

    /* ═══ URL extraction ═══ */
    function extractUrl(text) {
      const m = text.match(/https?:\/\/[^\s<>"']+/);
      if (m) {
        let url = m[0].replace(/[，。！？、）】》"']+$/, '');
        return url;
      }
      return text.trim();
    }

    /* ═══ Tab switching ═══ */
    function switchTab(tab) {
      ['twitter', 'youtube', 'bilibili'].forEach(t => {
        hide('tab-' + t);
        const btn = document.querySelector(`[data-tab="${t}"]`);
        btn.classList.toggle('active', t === tab);
        btn.classList.toggle('text-slate-200', t === tab);
        btn.classList.toggle('text-slate-400', t !== tab);
      });
      show('tab-' + tab);
    }

    /* ═══ Toggle helpers ═══ */
    function makeToggle(bodyId, chevronId) {
      return () => {
        const body = $(bodyId), chev = $(chevronId);
        body.classList.toggle('open');
        chev.style.transform = body.classList.contains('open') ? 'rotate(180deg)' : '';
      };
    }
    const toggleTwSettings = makeToggle('twSettingsBody', 'twChevron');
    const toggleYtSettings = makeToggle('ytSettingsBody', 'ytChevron');
    const toggleBiliSettings = makeToggle('biliSettingsBody', 'biliChevron');

    /* ═══ Format renderer ═══ */
    function renderFormats(containerId, fmts) {
      const wrap = $(containerId);
      wrap.innerHTML = '';
      let selected = fmts[0]?.format_id;
      fmts.forEach((f, i) => {
        const label = f.height + 'p';
        const note = f.tbr ? ` ~${Math.round(f.tbr)}kbps` : '';
        wrap.insertAdjacentHTML('beforeend', `
          <label class="flex items-center gap-2 px-3 py-2 rounded-lg border border-slate-700 cursor-pointer
                        hover:border-blue-500/50 has-[:checked]:border-blue-500 has-[:checked]:bg-blue-500/10 transition text-sm">
            <input type="radio" name="${containerId}" value="${f.format_id}" ${i===0?'checked':''} class="accent-blue-500">
            <span class="font-medium">${label}</span>
            <span class="text-[11px] text-slate-500">${f.ext}${note}</span>
          </label>
        `);
      });
      wrap.querySelectorAll('input[type=radio]').forEach(r => {
        r.addEventListener('change', () => { selected = r.value; });
      });
      return () => selected;
    }

    /* ═══ Subtitle renderer ═══ */
    function renderSubtitles(selectId, sectionId, subs) {
      const sel = $(selectId), sec = $(sectionId);
      sel.innerHTML = '<option value="">不烧录字幕</option>';
      if (!subs?.length) { hide(sectionId); return; }
      subs.forEach(s => {
        const tag = s.auto ? ' [自动]' : '';
        sel.insertAdjacentHTML('beforeend', `<option value="${s.lang}">${s.lang} - ${s.name}${tag}</option>`);
      });
      show(sectionId);
    }

    /* ═══ Save dir + open folder ═══ */
    function getSaveDir() {
      return $('globalSaveDir').value.trim() || '';
    }
    function persistSaveDir() {
      try { localStorage.setItem('saveDir', $('globalSaveDir').value); } catch (e) {}
    }
    function loadSaveDir() {
      let v = '';
      try { v = localStorage.getItem('saveDir') || ''; } catch (e) {}
      $('globalSaveDir').value = v || 'D:\\SaveBox\\下载';
    }
    async function openFolder(path) {
      try {
        const r = await fetch('/api/open-folder', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path }),
        });
        if (!r.ok) { const e = await r.json(); throw new Error(e.detail || '打开失败'); }
      } catch (e) { alert('打开文件夹失败：' + e.message); }
    }

    /* ═══ Download with progress tracking (SSE-based) ═══ */

    // ── formatting helpers: auto unit selection + readable durations ──
    function formatSpeed(bps) {
      if (!bps || bps <= 0) return '0 B/s';
      const units = ['B/s', 'KB/s', 'MB/s', 'GB/s'];
      let v = bps, i = 0;
      while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
      const digits = v >= 100 ? 0 : v >= 10 ? 1 : 2;
      return v.toFixed(digits) + ' ' + units[i];
    }
    function formatDuration(sec) {
      sec = Math.max(0, Math.floor(sec || 0));
      if (sec < 60) return sec + '秒';
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      const mm = String(m).padStart(2, '0');
      const ss = String(s).padStart(2, '0');
      return h > 0 ? `${String(h).padStart(2,'0')}:${mm}:${ss}` : `${mm}:${ss}`;
    }

    // ── single-download UI session ──
    // Drives the live telemetry row (speed · elapsed · ETA). All numbers come
    // from real backend telemetry; speed is EMA-smoothed for stability and the
    // clock refreshes on its own 1s tick independent of SSE cadence.
    const progressSession = {
      startTime: 0,
      smoothedSpeed: 0,   // EMA-smoothed bytes/sec (avoids jittery digits)
      totalBytes: 0,
      downloadedBytes: 0,
      eta: 0,
      merging: false,
      finished: false,
      _timer: null,

      start() {
        this.startTime = Date.now();
        this.smoothedSpeed = 0;
        this.totalBytes = 0;
        this.downloadedBytes = 0;
        this.eta = 0;
        this.merging = false;
        this.finished = false;
        show('progressStats');
        this._render();
        if (this._timer) clearInterval(this._timer);
        this._timer = setInterval(() => this._render(), 1000);
      },
      stop() {
        if (this._timer) { clearInterval(this._timer); this._timer = null; }
      },
      // feed real backend telemetry into the session
      apply(data) {
        if (data.status === 'downloading') {
          this.merging = false;
          this.totalBytes = data.total_bytes || this.totalBytes;
          this.downloadedBytes = data.downloaded_bytes || this.downloadedBytes;
          this.eta = data.eta || 0;
          const inst = data.speed || 0;
          // exponential moving average -> smooth out per-tick jitter
          this.smoothedSpeed = this.smoothedSpeed === 0
            ? inst
            : this.smoothedSpeed * 0.6 + inst * 0.4;
        } else if (data.status === 'merging') {
          this.merging = true;
          this.smoothedSpeed = 0;
          this.eta = 0;
        }
        this._render();
      },
      _render() {
        if (this.finished) return;
        const elapsed = Math.floor((Date.now() - this.startTime) / 1000);
        $('statElapsed').textContent = '已用 ' + formatDuration(elapsed);
        if (this.merging) {
          // merge/transcode phase: speed & ETA are meaningless, keep only the clock
          $('statSpeed').textContent = '';
          $('statEta').textContent = '';
          return;
        }
        const speed = this.smoothedSpeed;
        if (speed > 1) {
          $('statSpeed').textContent = formatSpeed(speed) + ' · ';
          // prefer yt-dlp's own ETA; fall back to remaining bytes / smoothed speed
          let eta = this.eta;
          if ((!eta || eta <= 0) && this.totalBytes > 0) {
            const remaining = this.totalBytes - this.downloadedBytes;
            if (remaining > 0) eta = remaining / speed;
          }
          $('statEta').textContent = eta > 0
            ? ' · 剩余约 ' + formatDuration(Math.round(eta))
            : ' · 剩余约 计算中…';
        } else {
          // just started / stalled / unknown — never fabricate numbers
          $('statSpeed').textContent = '计算中… · ';
          $('statEta').textContent = ' · 剩余约 计算中…';
        }
      },
      finishOK() {
        this.finished = true;
        this.stop();
        const total = Math.floor((Date.now() - this.startTime) / 1000);
        $('progressLabel').textContent = '下载完成 · 共用时 ' + formatDuration(total);
        hide('progressStats');
      },
      fail() {
        this.finished = true;
        this.stop();
        // stop the clock but keep the elapsed time visible (frozen)
        const elapsed = Math.floor((Date.now() - this.startTime) / 1000);
        $('progressLabel').textContent = '下载失败 · 已用 ' + formatDuration(elapsed);
        $('statSpeed').textContent = '';
        $('statEta').textContent = '';
        $('statElapsed').textContent = '已用 ' + formatDuration(elapsed);
      },
    };

    function downloadWithProgress(apiUrl, body) {
      return new Promise(async (resolve, reject) => {
        let task_id = null;
        let es = null;
        try {
          // inject save dir
          body = { ...body, save_dir: getSaveDir() };
          const r = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          if (!r.ok) {
            const e = await r.json();
            throw new Error(e.detail || `HTTP ${r.status}`);
          }
          const res = await r.json();
          task_id = res.task_id;

          // reset UI + start the live telemetry session
          show('progressArea');
          hide('progressDone');
          $('progressBar').style.width = '0%';
          $('progressPct').textContent = '0%';
          $('progressLabel').textContent = '下载中…';
          progressSession.start();

          // SSE subscription for live progress
          es = new EventSource(`/api/progress/stream/${task_id}`);
          es.onmessage = (ev) => {
            let data;
            try { data = JSON.parse(ev.data); } catch (e) { return; }
            handleProgress(data, resolve, reject, () => { if (es) es.close(); });
          };
          es.onerror = () => {
            // fall back to polling if SSE breaks
            if (es) { es.close(); es = null; }
            const poll = setInterval(async () => {
              try {
                const pr = await fetch(`/api/progress/${task_id}`);
                if (!pr.ok) throw new Error('progress fetch failed');
                const data = await pr.json();
                handleProgress(data, resolve, reject, () => clearInterval(poll));
              } catch (e) {
                clearInterval(poll);
                progressSession.fail();
                reject(e);
              }
            }, 800);
          };
        } catch (e) {
          if (es) es.close();
          progressSession.fail();
          reject(e);
        }
      });
    }

    // Shared progress handler for both SSE and polling paths.
    // Returns true when terminal.
    function handleProgress(data, resolve, reject, cleanup) {
      if (data.status === 'downloading') {
        $('progressBar').style.width = data.progress + '%';
        $('progressPct').textContent = data.progress + '%';
        $('progressLabel').textContent = '下载中…';
        progressSession.apply(data);
      } else if (data.status === 'merging') {
        // keep the bar at its last real value (<100%) — don't fake completion
        $('progressLabel').textContent = '正在合并音视频…';
        progressSession.apply(data);
      } else if (data.status === 'done') {
        cleanup();
        progressSession.finishOK();
        $('progressBar').style.width = '100%';
        $('progressPct').textContent = '100%';
        // show save path + open-folder button (file already on disk)
        const path = data.save_path || '';
        $('progressDonePath').textContent = path ? ('已保存到：' + path) : '下载完成';
        if (path) {
          $('progressOpenBtn').onclick = () => openFolder(path);
          show('progressOpenBtn');
        } else { hide('progressOpenBtn'); }
        show('progressDone');
        // NOTE: the progress area is intentionally kept visible so the total
        // time stays on screen — it resets when the next download starts.
        resolve(data);
        return true;
      } else if (data.status === 'error') {
        cleanup();
        progressSession.fail();
        reject(new Error(data.error || '下载失败'));
        return true;
      }
      return false;
    }

    /* ═══ Batch download ═══ */
    function parseUrlsFromInput(raw) {
      // extract all http(s) links from arbitrary multi-line text
      const matches = raw.match(/https?:\/\/[^\s<>"']+/g) || [];
      return matches.map(u => u.replace(/[，。！？、）】》"']+$/, ''));
    }

    async function startBatch(platform) {
      const inputId = { twitter: 'twUrlInput', youtube: 'ytUrlInput', bilibili: 'biliUrlInput' }[platform];
      const raw = $(inputId).value.trim();
      const urls = parseUrlsFromInput(raw);
      if (urls.length === 0) {
        alert('请先在输入框粘贴一个或多个链接（一行一个）');
        return;
      }
      if (urls.length === 1) {
        alert('只检测到 1 个链接，请直接用「解析」按钮。批量需至少 2 个链接。');
        return;
      }

      const settings = { twitter: twSettings, youtube: ytSettings, bilibili: biliSettings }[platform]();
      const body = {
        urls, platform,
        proxy: settings.proxy,
        cookie_content: settings.cookie_content,
        save_dir: getSaveDir(),
        concurrency: 3,
      };

      show('batchArea');
      $('batchLabel').textContent = `批量下载（${urls.length} 个）`;
      $('batchSummary').textContent = '提交中…';
      $('batchList').innerHTML = '';

      try {
        const r = await fetch('/api/batch', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!r.ok) { const e = await r.json(); throw new Error(e.detail || `HTTP ${r.status}`); }
        const { tasks } = await r.json();
        $('batchSummary').textContent = `${tasks.filter(t => t.task_id).length}/${tasks.length} 已加入队列`;
        // render one row per url, subscribe SSE per task
        tasks.forEach(t => {
          const row = document.createElement('div');
          row.className = 'flex items-center gap-2 text-xs py-1';
          row.innerHTML = `
            <span class="batch-icon text-slate-500">⏳</span>
            <span class="batch-url text-slate-300 truncate flex-1" title="${t.url}">${t.url}</span>
            <span class="batch-pct text-slate-400 font-mono w-10 text-right">${t.skipped ? '跳过' : '0%'}</span>
            <span class="batch-act"></span>`;
          $('batchList').appendChild(row);
          if (t.task_id) {
            trackBatchTask(t.task_id, row);
          } else {
            row.querySelector('.batch-icon').textContent = '⊘';
            row.querySelector('.batch-icon').className = 'batch-icon text-amber-500';
          }
        });
        refreshHistory();
      } catch (e) {
        $('batchSummary').textContent = '失败：' + e.message;
      }
    }

    function trackBatchTask(taskId, row) {
      const icon = row.querySelector('.batch-icon');
      const pct = row.querySelector('.batch-pct');
      const act = row.querySelector('.batch-act');
      let es = null;
      let done = false;
      const poll = async () => {
        // SSE with polling fallback
        try {
          es = new EventSource(`/api/progress/stream/${taskId}`);
          es.onmessage = (ev) => {
            let d; try { d = JSON.parse(ev.data); } catch (e) { return; }
            apply(d);
          };
          es.onerror = () => {
            if (es) { es.close(); es = null; }
            if (!done) setTimeout(pollFallback, 1000);
          };
        } catch (e) { pollFallback(); }
      };
      const pollFallback = () => {
        const iv = setInterval(async () => {
          try {
            const pr = await fetch(`/api/progress/${taskId}`);
            const d = await pr.json();
            if (apply(d)) clearInterval(iv);
          } catch (e) {}
        }, 1200);
      };
      const apply = (d) => {
        if (d.status === 'downloading') {
          icon.textContent = '⬇'; icon.className = 'batch-icon text-blue-400';
          pct.textContent = d.progress + '%';
        } else if (d.status === 'merging') {
          pct.textContent = '99%';
        } else if (d.status === 'done') {
          done = true;
          icon.textContent = '✓'; icon.className = 'batch-icon text-emerald-400';
          pct.textContent = '完成';
          if (d.save_path) {
            const btn = document.createElement('button');
            btn.textContent = '打开';
            btn.className = 'text-blue-400 hover:text-blue-300';
            btn.onclick = () => openFolder(d.save_path);
            act.innerHTML = ''; act.appendChild(btn);
          }
          if (es) es.close();
          updateBatchSummary();
          return true;
        } else if (d.status === 'error') {
          done = true;
          icon.textContent = '✗'; icon.className = 'batch-icon text-red-400';
          pct.textContent = '失败';
          pct.title = d.error || '';
          if (es) es.close();
          updateBatchSummary();
          return true;
        }
        return false;
      };
      poll();
    }

    function updateBatchSummary() {
      const rows = $('batchList').querySelectorAll('.batch-icon');
      let ok = 0, err = 0;
      rows.forEach(r => {
        const t = r.textContent;
        if (t === '✓') ok++;
        else if (t === '✗') err++;
      });
      const total = rows.length;
      const finished = ok + err;
      $('batchSummary').textContent = `完成 ${finished}/${total}（成功 ${ok}，失败 ${err}）`;
    }

        const statusIcon = t.status === 'done' ? '<span class="text-emerald-400">✓</span>'
          : t.status === 'error' ? '<span class="text-red-400">✗</span>'
          : '<span class="text-blue-400">⏵</span>';

          ? `<button onclick="openFolder('${safePath}')" class="text-blue-400 hover:text-blue-300 flex-shrink-0">打开</button>`
          : '';
        const errMsg = t.status === 'error' && t.error ? `<span class="text-red-400 truncate" title="${(t.error||'').replace(/"/g,'&quot;')}">${(t.error||'').slice(0,30)}</span>` : '';

              ${platformTag}
            </div>
            <div class="text-[10px] text-slate-500">${date} ${errMsg}</div>
          </div>
      ${openBtn}`;
    // delete button (DOM-appended to avoid filename quoting headaches)
    const delBtn = document.createElement('button');
    delBtn.className = 'text-slate-500 hover:text-red-400 flex-shrink-0 transition';
    delBtn.title = '删除';
    delBtn.innerHTML = '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>';
    delBtn.onclick = () => deleteHistoryItem(t.task_id, name, t.status === 'done' && !!t.save_path);
    row.appendChild(delBtn);
    wrap.appendChild(row);
  });
}

    /* ═══ History management (delete single / clear all) ═══ */
    let _histDelResolver = null;
    // Opens the shared delete-confirm modal. Resolves to {delFile} when
    // confirmed, or null when cancelled. `hasFile` toggles whether the
    // "also delete file" checkbox is available.
    function showHistDelModal(title, msg, fileHint, hasFile) {
      return new Promise(resolve => {
        _histDelResolver = resolve;
        $('histDelTitle').textContent = title;
        $('histDelMsg').textContent = msg;
        $('histDelFileHint').textContent = fileHint || '';
        const chk = $('histDelFileChk');
        chk.disabled = !hasFile;
        chk.checked = false;
        $('histDelFileLabel').style.opacity = hasFile ? '1' : '0.4';
        $('histDelFileLabel').style.cursor = hasFile ? 'pointer' : 'not-allowed';
        show('histDelModal');
      });
    }
    function closeHistDelModal(confirmed) {
      hide('histDelModal');
      if (_histDelResolver) {
        _histDelResolver(confirmed ? { delFile: $('histDelFileChk').checked } : null);
        _histDelResolver = null;
      }
    }
    async function deleteHistoryItem(taskId, name, hasFile) {
      const r = await showHistDelModal(
        '删除历史记录',
        `确定删除「${name}」的记录吗？`,
        hasFile ? '该操作不可恢复' : '',
        hasFile
      );
      if (!r) return;
      await _histDelete(`/api/history/${taskId}?delete_file=${r.delFile}`, '删除失败');
    }
    async function clearAllHistory() {
      const r = await showHistDelModal(
        '清空全部历史',
        '确定清空所有历史记录吗？此操作不可撤销。',
        '将删除所有已下载文件，不可恢复',
        true
      );
      if (!r) return;
      await _histDelete(`/api/history?delete_file=${r.delFile}`, '清空失败');
    }
    // Shared DELETE helper: reads the error body safely (never throws on a
    // non-JSON response, e.g. a 405 page), surfaces the HTTP status so the
    // cause is diagnosable, and refreshes history so the UI stays truthful.
    async function _histDelete(url, label) {
      try {
        const resp = await fetch(url, { method: 'DELETE' });
        if (!resp.ok) {
          let detail = `HTTP ${resp.status}`;
          try { const e = await resp.json(); detail = e.detail || detail; } catch (_) {}
          // 404/405 almost always means the running backend predates these
          // delete endpoints — the user needs to restart `python app.py`.
          if (resp.status === 404 || resp.status === 405) {
            detail += '（后端可能未重启，请重启 python app.py 后重试）';
          }
          throw new Error(detail);
        }
        refreshHistory();
      } catch (e) {
        alert(label + '：' + e.message);
      }
    }

    /* ═══ Init ═══ */
    loadSaveDir();
    $('globalSaveDir').addEventListener('change', persistSaveDir);
    $('globalSaveDir').addEventListener('blur', persistSaveDir);
  </script>
</body>
</html>
